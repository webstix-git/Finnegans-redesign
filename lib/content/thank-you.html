<div style="--ink:#16100c;--ink2:#1f1711;--brick:#a23a2c;--brick2:#7a2a1f;--gold:#ece1cb;--gold2:#f5eede;--cream:#f2e7d2;--cream2:#e0d0b1;--muted:#bca988;--green:#2f5a3a;font-family:Montserrat,sans-serif;background:#16100c;color:#f2e7d2;overflow-x:hidden;">

  <!-- NAV -->
  <header id="fw-header" style="position:fixed;top:0;left:0;right:0;z-index:50;"><nav></nav></header>

  <!-- HERO -->
  <section id="top" style="position:relative;min-height:72vh;display:flex;align-items:flex-end;overflow:hidden;">
    <div style="position:absolute;inset:0;overflow:hidden;">
      <img src="/assets/746f3b76-7d1c-45ab-b018-d4b4700c0367.jpg" alt="Inside Finnegan's Wake" style="width:100%;height:100%;object-fit:cover;object-position:50% 42%;opacity:.45;">
    </div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,9,6,.62) 0%,rgba(13,9,6,.18) 36%,rgba(13,9,6,.72) 75%,rgba(13,9,6,.97) 100%);"></div>
    <div style="position:relative;max-width:780px;margin:0 auto;padding:0 24px 76px;width:100%;text-align:center;">
      <div style="font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.34em;font-size:12px;color:var(--gold2);font-weight:500;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:14px;">
        <span style="width:38px;height:1.5px;background:var(--gold);display:inline-block;"></span>Message received<span style="width:38px;height:1.5px;background:var(--gold);display:inline-block;"></span>
      </div>
      <h1 style="font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;line-height:1;font-size:clamp(42px,6.5vw,88px);color:var(--cream);text-shadow:0 2px 30px rgba(0,0,0,.5);">Thank You</h1>
    </div>
  </section>

  <!-- CONTENT -->
  <section style="background:var(--cream);color:#3a2c1d;padding:clamp(56px,7vw,88px) 0;">
    <div style="max-width:640px;margin:0 auto;padding:0 24px;text-align:center;">
      <div style="width:64px;height:64px;margin:0 auto 28px;border-radius:50%;background:rgba(47,90,58,.15);border:1px solid rgba(47,90,58,.35);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--green);">✓</div>
      <h2 style="font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;line-height:1.1;font-size:clamp(28px,4vw,44px);color:#2a1d12;">We Got Your Note</h2>
      <p style="font-size:17px;line-height:1.8;color:#5a4631;margin-top:22px;">Thanks for reaching out to Finnegan's Wake. Someone from our team will get back to you as soon as we can.</p>
      <p style="font-size:15px;line-height:1.75;color:#7a6346;margin-top:16px;">If your question is time-sensitive, calling the pub is always your best bet.</p>
      <div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:36px;">
        <a href="/" style="display:inline-flex;align-items:center;gap:8px;background:var(--brick);color:var(--cream);font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:13px;font-weight:600;padding:16px 30px;border-radius:2px;text-decoration:none;border:1px solid var(--brick);transition:background .25s ease,transform .2s ease;" style-hover="background:var(--brick2);transform:translateY(-1px)">Back to Home</a>
        <a href="tel:+14178691500" style="display:inline-flex;align-items:center;gap:8px;background:transparent;color:#3a2c1d;font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:13px;font-weight:600;padding:15px 30px;border-radius:2px;text-decoration:none;border:1px solid rgba(58,44,29,.4);transition:background .25s ease,transform .2s ease;" style-hover="background:rgba(58,44,29,.08);transform:translateY(-1px)">Call the Pub</a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer style="background:#0c0805;"><div></div></footer>

</div>
